<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유네코 지수 통합선별공장 프로젝트</title>
<meta name="description" content="공사일보, 회의록, 보고서를 프로젝트별 허브에서 빠르게 찾고 여는 MarkTL 공유 아카이브.">
<style>
*{box-sizing:border-box}html,body{height:100%;background:#050507}body{margin:0;min-width:0;width:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7f8fb;background:radial-gradient(circle at 12% 0%,rgba(255,61,61,.3),transparent 32rem),radial-gradient(circle at 88% 5%,rgba(25,211,197,.22),transparent 30rem),linear-gradient(180deg,#08090d 0%,#111014 48%,#050507 100%);overflow:hidden}a{color:inherit;text-decoration:none}button,input{font:inherit}.app{width:min(1480px,100%);height:100dvh;margin:0 auto;padding:clamp(14px,2vw,28px);display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;overflow:hidden}.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(190px,222px);gap:22px;align-items:start;min-height:0}.hero-panel{display:grid;align-content:start;gap:0;min-width:0;padding-top:8px}.eyebrow{margin:0 0 8px;color:#ffb020;font-size:12px;font-weight:950;letter-spacing:.16em;text-transform:uppercase}.top h1{max-width:860px;margin:0;font-size:clamp(30px,4vw,56px);line-height:1.02;letter-spacing:0;font-weight:950;text-wrap:balance}.hero-copy{max-width:820px;margin:12px 0 0;color:#c8d0dc;font-size:clamp(14px,1.18vw,17px);line-height:1.5}.calendar{width:100%;height:180px;min-height:180px;align-self:start;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:linear-gradient(135deg,rgba(255,255,255,.105),rgba(255,255,255,.045));box-shadow:0 14px 34px rgba(0,0,0,.24);padding:9px 10px 12px;backdrop-filter:blur(18px)}.cal-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px}.cal-title{font-size:13px;font-weight:950;letter-spacing:.02em}.cal-nav{display:flex;gap:4px}.cal-nav button{display:grid;place-items:center;width:22px;height:22px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.07);color:#fff;cursor:pointer}.cal-nav button:hover{background:#ff3d3d}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:2px}.cal-week{color:#8d98a8;font-size:8px;font-weight:900;text-align:center}.cal-day{position:relative;display:grid;place-items:center;min-height:14px;border:0;border-radius:5px;background:transparent;color:#cfd6e4;font-size:9px;font-weight:800}.cal-day.muted{opacity:.28}.cal-day.has-doc{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:0!important;min-height:18px!important;padding:1px 2px!important;line-height:1!important;cursor:pointer;color:#fff;background:linear-gradient(135deg,#ff3d3d,#ff9f1c);box-shadow:0 6px 12px rgba(255,80,40,.2)}.cal-day.has-doc::after{content:attr(data-type);display:block;max-width:28px;font-size:5.5px;font-weight:900;color:rgba(255,255,255,.86);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.toolbar{position:static;display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:10px;align-items:center;max-width:100%;overflow:hidden;margin-top:16px;padding:8px 0 0;background:transparent;border:0;backdrop-filter:none}.search{height:38px;min-width:0;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:rgba(255,255,255,.08);color:#fff;padding:0 13px;outline:none}.search::placeholder{color:#8f98a8}.search:focus{border-color:#ffb020;box-shadow:0 0 0 3px rgba(255,176,32,.16)}.filters{min-width:0;max-width:100%;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;max-height:48px;overflow:hidden;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filters button,.tags button{border:1px solid rgba(255,255,255,.13);border-radius:999px;background:rgba(255,255,255,.065);color:#dce3ef;cursor:pointer;white-space:nowrap}.filters button{height:22px;padding:0 7px;font-size:10px;line-height:1;font-weight:850}.filters button.active{border-color:#ff3d3d;background:#ff3d3d;color:#fff}.content{min-height:0;overflow:auto;padding:0 2px 28px 0;scrollbar-color:rgba(255,255,255,.26) transparent}.content::-webkit-scrollbar{width:10px}.content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:999px}.section-head{position:static;display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 8px;padding:2px 0 8px;background:transparent}.section-head h2{margin:0;font-size:18px;letter-spacing:0}.section-head span{color:#9aa4b5;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}.tile{container-type:inline-size;position:relative;display:grid;grid-template-columns:minmax(142px,44%) minmax(0,1fr);height:96px;min-height:0;overflow:hidden;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:linear-gradient(135deg,rgba(255,255,255,.095),rgba(255,255,255,.035));box-shadow:0 16px 34px rgba(0,0,0,.28);animation:tileIn .42s ease both;animation-delay:calc(var(--i)*42ms);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 34%,transparent),transparent 58%);opacity:.34;pointer-events:none}.tile:hover{transform:translateY(-4px) scale(1.01);border-color:color-mix(in srgb,var(--accent) 72%,white);box-shadow:0 24px 54px rgba(0,0,0,.42)}.poster{position:relative;min-width:0;background:#181a22;overflow:hidden;border-right:1px solid rgba(255,255,255,.08)}.poster img{width:100%;height:100%;min-height:0;object-fit:cover;display:block;transform:scale(1.01);transition:transform .25s ease,filter .25s ease}.tile:hover .poster img{transform:scale(1.05);filter:saturate(1.12)}.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 48%,rgba(10,10,12,.88) 100%)}.tile-body{position:relative;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:11px 34px 11px 11px}.meta-line{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px;color:#aab4c4;font-size:10px;font-weight:850}.type{color:var(--accent2);text-transform:uppercase}.tile h2{margin:0;color:#fff;font-size:clamp(13.5px,4.2cqi,17px);line-height:1.16;letter-spacing:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.tile p{display:none}.tags{display:none}.tags::-webkit-scrollbar{display:none}.tags button{flex:0 0 auto;height:21px;line-height:1;padding:0 7px;font-size:10px;max-width:132px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.play{position:absolute;right:12px;bottom:12px;z-index:4;display:grid;place-items:center;width:30px;height:30px;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 20px rgba(0,0,0,.26);font-size:12px}.empty{padding:18px;border:1px dashed rgba(255,255,255,.2);border-radius:8px;color:#aab4c4}.hidden{display:none!important}@keyframes tileIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:1280px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tile{height:98px}}@media(max-width:980px){.app{padding:10px 12px 16px;gap:8px}.top{grid-template-columns:1fr;gap:9px}.hero-panel{padding-top:0}.eyebrow{font-size:10px;margin-bottom:5px;letter-spacing:.14em}.top h1{font-size:clamp(25px,7.4vw,32px);line-height:1.02;max-width:360px}.hero-copy{margin-top:7px;font-size:12.5px;line-height:1.42;max-width:390px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.toolbar{grid-template-columns:1fr;gap:6px;margin-top:8px;padding:0;overflow:visible}.search{height:34px;border-radius:7px;font-size:12.5px;padding:0 10px}.filters{max-height:52px;gap:4px}.filters button{height:22px;padding:0 7px;font-size:10px}.calendar{width:min(222px,100%);height:154px;min-height:154px;justify-self:end;padding:8px 9px 10px}.cal-title{font-size:12px}.cal-nav button{width:20px;height:20px}.cal-week{font-size:7.5px}.cal-day{min-height:12px;font-size:8.5px}.cal-day.has-doc{min-height:16px!important;padding:1px 2px!important}.cal-day.has-doc::after{display:none}.section-head{padding:4px 0 7px;margin-bottom:7px}.section-head h2{font-size:15px}.section-head span{font-size:11px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{grid-template-columns:minmax(132px,44%) minmax(0,1fr);height:92px;min-height:0;border-radius:8px}.poster{width:auto;border:0;border-radius:0}.poster img{min-height:0;height:100%;object-fit:cover}.poster::after{background:linear-gradient(90deg,transparent 28%,rgba(10,10,12,.9) 100%)}.tile-body{padding:8px 30px 8px 10px}.meta-line{font-size:9.5px;margin-bottom:4px}.tile h2{font-size:15px;line-height:1.12;-webkit-line-clamp:2}.tile p{display:none}.play{width:24px;height:24px;right:7px;bottom:7px;font-size:10px}.tags{display:none}}@media(max-width:640px){.grid{grid-template-columns:1fr}.tile{grid-template-columns:150px minmax(0,1fr);height:86px}}@media(max-width:420px){.app{padding:9px 10px 14px}.calendar{display:none}.tile{grid-template-columns:132px minmax(0,1fr);height:78px;min-height:0}.poster img{min-height:0}.top h1{font-size:25px}.hero-copy{font-size:12px}.filters button{font-size:10px}.tile h2{font-size:14.5px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="hero-panel">
      <p class="eyebrow">통합선별공장 Archive</p>
      <h1>유네코 지수 통합선별공장 프로젝트</h1>
      <p class="hero-copy">공사일보, 회의록, 보고서를 프로젝트별 허브에서 빠르게 찾고 여는 MarkTL 공유 아카이브.</p>
      <section class="toolbar" aria-label="검색과 필터">
        <input class="search" id="search" type="search" placeholder="문서, 현장, 회의, 태그 검색" aria-label="문서 검색">
        <div class="filters"><button class="active" type="button" data-filter="">전체</button></div>
      </section>
    </div>
    <aside class="calendar" aria-label="게시 날짜 캘린더">
      <div class="cal-head"><button type="button" class="cal-title" id="calTitle" aria-label="현재 월"></button><div class="cal-nav"><button type="button" id="prevMonth" aria-label="이전 달">‹</button><button type="button" id="nextMonth" aria-label="다음 달">›</button></div></div>
      <div class="cal-grid" id="calendarGrid"></div>
    </aside>
  </header>
  <section class="content" aria-label="문서 목록 스크롤 영역">
    <div class="section-head"><h2>지금 볼 문서</h2><span id="count">0개 표시</span></div>
    <main class="grid" id="items"><p class="empty">게시된 문서가 없습니다.</p></main>
  </section>
</div>
<script>
const docs=[];
const initialMonth='2026-06';
const search=document.getElementById('search');const count=document.getElementById('count');const cards=[...document.querySelectorAll('.tile')];let activeType='';let activeTag='';let activeDate='';let calDate=new Date(Number(initialMonth.slice(0,4)),Number(initialMonth.slice(5,7))-1,1);
function apply(){const q=(search.value||'').trim().toLowerCase();let n=0;for(const card of cards){const okQ=!q||card.dataset.search.includes(q);const okT=!activeType||card.dataset.type===activeType;const okTag=!activeTag||(' '+card.dataset.tags+' ').includes(' '+activeTag+' ');const okDate=!activeDate||card.dataset.date===activeDate;const show=okQ&&okT&&okTag&&okDate;card.classList.toggle('hidden',!show);if(show)n++;}count.textContent=(activeDate?activeDate+' · ':'')+n+'개 표시';}
function setActiveButton(btn){document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('active',b===btn));}
document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{activeType=btn.dataset.filter||'';activeTag='';activeDate='';setActiveButton(btn);apply();}));document.querySelectorAll('[data-tag]').forEach(btn=>btn.addEventListener('click',()=>{activeTag=btn.dataset.tag||'';activeType='';activeDate='';setActiveButton(btn);apply();}));search.addEventListener('input',()=>{activeDate='';apply();});
function docsByDate(date){return docs.filter(d=>d.date===date)}
function renderCalendar(){const y=calDate.getFullYear();const m=calDate.getMonth();const title=document.getElementById('calTitle');title.textContent=y+'.'+String(m+1).padStart(2,'0');const grid=document.getElementById('calendarGrid');grid.innerHTML='';['일','월','화','수','목','금','토'].forEach(w=>{const el=document.createElement('div');el.className='cal-week';el.textContent=w;grid.append(el);});const first=new Date(y,m,1);const days=new Date(y,m+1,0).getDate();for(let i=0;i<first.getDay();i++){const blank=document.createElement('span');blank.className='cal-day muted';grid.append(blank);}for(let d=1;d<=days;d++){const date=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');const dayDocs=docsByDate(date);const button=document.createElement('button');button.type='button';button.className='cal-day'+(dayDocs.length?' has-doc':'');button.textContent=String(d);button.dataset.date=date;if(dayDocs.length){button.dataset.type=dayDocs[0].type;button.title=dayDocs.map(x=>x.title).join(String.fromCharCode(10));button.addEventListener('click',()=>{if(dayDocs.length===1){location.href=dayDocs[0].url;}else{activeDate=date;activeType='';activeTag='';setActiveButton(document.querySelector('[data-filter=""]'));apply();}});}grid.append(button);}}
document.getElementById('prevMonth').addEventListener('click',()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);renderCalendar();});document.getElementById('nextMonth').addEventListener('click',()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);renderCalendar();});document.getElementById('calTitle').addEventListener('click',()=>{calDate=new Date(Number(initialMonth.slice(0,4)),Number(initialMonth.slice(5,7))-1,1);renderCalendar();});renderCalendar();apply();
</script>
</body>
</html>
